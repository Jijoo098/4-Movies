{% extends "base.html" %}
{% block content %}
<div class="container mt-4 text-white">
  <h2>➕ Add Diary Entry</h2>
  <form method="POST">
    <div class="mb-3">
      <label for="title" class="form-label">Movie Title</label>
      <input type="text" class="form-control" id="title" name="title" required>
    </div>

    <div class="mb-3">
      <label for="poster_url" class="form-label">Poster URL (from OMDb)</label>
      <input type="url" class="form-control" id="poster_url" name="poster_url">
    </div>

    <div class="mb-3">
      <label for="rating" class="form-label">Rating (1–10)</label>
      <input type="number" class="form-control" id="rating" name="rating" min="1" max="10" required>
    </div>

    <div class="mb-3">
      <label for="watched_date" class="form-label">Watched Date</label>
      <input type="date" class="form-control" id="watched_date" name="watched_date" required>
    </div>

    <div class="mb-3">
      <label for="review" class="form-label">Your Thoughts</label>
      <textarea class="form-control" id="review" name="review" rows="4" required></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Save Entry</button>
  </form>
</div>
{% endblock %}
