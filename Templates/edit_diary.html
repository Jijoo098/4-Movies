{% extends "base.html" %}
{% block content %}
<div class="container mt-4 text-white">
  <h2>✏️ Edit Diary Entry</h2>
  <form method="POST">
    <div class="mb-3">
      <label for="title" class="form-label">Movie Title</label>
      <input type="text" class="form-control" id="title" name="title" value="{{ entry.title }}" required>
    </div>

    <div class="mb-3">
      <label for="poster_url" class="form-label">Poster URL</label>
      <input type="url" class="form-control" id="poster_url" name="poster_url" value="{{ entry.poster_url }}">
    </div>

    <div class="mb-3">
      <label for="rating" class="form-label">Rating (1–10)</label>
      <input type="number" class="form-control" id="rating" name="rating" value="{{ entry.rating }}" min="1" max="10" required>
    </div>

    <div class="mb-3">
      <label for="watched_date" class="form-label">Watched Date</label>
      <input type="date" class="form-control" id="watched_date" name="watched_date" value="{{ entry.watched_date.strftime('%Y-%m-%d') }}" required>
    </div>

    <div class="mb-3">
      <label for="review" class="form-label">Your Thoughts</label>
      <textarea class="form-control" id="review" name="review" rows="4" required>{{ entry.review }}</textarea>
    </div>

    <button type="submit" class="btn btn-success">💾 Update Entry</button>
  </form>
</div>
{% endblock %}
