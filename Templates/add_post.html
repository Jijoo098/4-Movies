{% extends "base.html" %}
{% block title %}Add Movie Review{% endblock %}
{% block content %}
<div class="container my-5">
  <h2>Add a New Movie Review</h2>
  <form method="POST">
    <div class="mb-3">
      <label for="movie" class="form-label">Movie Title</label>
      <input type="text" class="form-control" id="movie" name="movie" required>
    </div>
    <div class="mb-3">
      <label for="rating" class="form-label">Rating (out of 10)</label>
      <input type="number" class="form-control" id="rating" name="rating" min="1" max="10" required>
    </div>
    <div class="mb-3">
      <label for="content" class="form-label">Review Content</label>
      <textarea class="form-control" id="content" name="content" rows="4" required></textarea>
    </div>
    <div class="mb-3">
      <label for="poster_url" class="form-label">Poster Image URL</label>
      <input type="url" class="form-control" id="poster_url" name="poster_url">
    </div>
    <button type="submit" class="btn btn-primary">Submit Review</button>
  </form>
</div>
{% endblock %}
