<!-- templates/edit_profile.html -->
{% extends "base.html" %}

{% block content %}
<div class="container mt-4 text-light">
  <h2>Edit Profile</h2>
  <form method="POST" enctype="multipart/form-data">
    <!-- Hidden CSRF field can be removed if not using Flask-WTF -->
    
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" name="username" id="username" class="form-control" value="{{ current_user.username }}" required>
    </div>

    <div class="mb-3">
      <label for="bio" class="form-label">Bio</label>
      <textarea name="bio" id="bio" class="form-control" rows="3">{{ current_user.bio }}</textarea>
    </div>

    <div class="mb-3">
      <label for="profile_pic" class="form-label">Profile Picture</label>
      <input type="file" name="profile_pic" id="profile_pic" class="form-control">
      
      {% if current_user.profile_pic %}
        <div class="mt-2">
          <img src="{{ url_for('static', filename='profile_pics/' ~ current_user.profile_pic) }}" width="100" class="img-thumbnail">
        </div>
      {% endif %}
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>
  </form>
</div>
{% endblock %}
