{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>📂 Your Movie Lists</h2>

  <a href="{{ url_for('create_list') }}" class="btn btn-success mb-3">➕ Create New List</a>

  {% if lists %}
    <ul class="list-group mt-3">
      {% for lst in lists %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <div>
            <h5>{{ lst.name }}</h5>
            <p class="mb-0 text-muted">{{ lst.description }}</p>
          </div>
          <div>
            <a href="{{ url_for('view_list', list_id=lst.id) }}" class="btn btn-sm btn-outline-primary me-2">👁️ View</a>
            <a href="{{ url_for('edit_list', list_id=lst.id) }}" class="btn btn-sm btn-outline-secondary me-2">✏️ Edit</a>
            <form action="{{ url_for('delete_list', list_id=lst.id) }}" method="POST" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this list?');">
              <button type="submit" class="btn btn-sm btn-outline-danger">🗑️ Delete</button>
            </form>
          </div>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>You haven’t created any movie lists yet.</p>
  {% endif %}
</div>
{% endblock %}
