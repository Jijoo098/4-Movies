{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>✏️ Edit List</h2>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">List Name</label>
      <input type="text" name="name" class="form-control" value="{{ movie_list.name }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-control" rows="3">{{ movie_list.description }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
  </form>
</div>
{% endblock %}
